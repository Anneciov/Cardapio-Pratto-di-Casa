<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pratto di Casa · Cardápio de hoje</title>
<meta name="description" content="Cardápio do dia do Pratto di Casa — comida caseira em Cajamar. Peça pelo WhatsApp.">
<meta name="theme-color" content="#121418">
<meta property="og:title" content="Pratto di Casa · Cardápio de hoje">
<meta property="og:description" content="Veja os pratos de hoje e peça pelo WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Kaushan+Script&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --laranja:#ff7a1a; --laranja2:#ffa94d; --quadro:#16191e; --quadro2:#1e232a; --linha:rgba(255,255,255,.08);
    --texto:#f3f4f6; --suave:#9aa3ad; --sombra:0 50px 90px -30px rgba(0,0,0,.85);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--texto);background:#0b0c0f;overflow-x:hidden}
  /* cena: luzes quentes desfocadas atrás do quadro, como num restaurante */
  .cena{position:relative;min-height:100vh;padding:28px 16px 120px;display:flex;justify-content:center;perspective:1600px;
    background:radial-gradient(circle at 12% 18%,rgba(255,150,60,.22),transparent 26%),radial-gradient(circle at 88% 10%,rgba(255,196,120,.16),transparent 22%),
      radial-gradient(circle at 80% 85%,rgba(255,122,26,.14),transparent 30%),radial-gradient(circle at 15% 90%,rgba(120,160,255,.08),transparent 30%),linear-gradient(180deg,#14161b,#0b0c0f)}
  .bokeh{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .bokeh i{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,180,100,.35),transparent 70%);filter:blur(2px);animation:boia 14s ease-in-out infinite alternate}
  @keyframes boia{to{transform:translateY(-30px) scale(1.15)}}
  .quadro{position:relative;z-index:1;width:100%;max-width:820px;border-radius:26px;overflow:hidden;transform-style:preserve-3d;transition:transform .25s ease-out;box-shadow:var(--sombra),0 0 0 1px rgba(255,255,255,.05);
    background:radial-gradient(ellipse 80% 40% at 50% 0%,rgba(255,122,26,.10),transparent 70%),linear-gradient(160deg,var(--quadro2),var(--quadro) 45%,#121418)}
  .quadro::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:4px 4px}
  .quadro::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.07),transparent 30%,transparent 70%,rgba(255,255,255,.03))}
  /* cabeçalho */
  header{position:relative;padding:30px 28px 10px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .selo{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,var(--laranja2),var(--laranja));display:grid;place-items:center;font:700 26px Oswald,sans-serif;color:#1a0d02;box-shadow:0 10px 24px -8px rgba(255,122,26,.7);transform:translateZ(30px)}
  .marca{flex:1;min-width:200px}
  .marca h1{font:700 clamp(30px,6vw,44px)/1 Oswald,sans-serif;letter-spacing:.02em;text-transform:uppercase}
  .marca h1 b{color:var(--laranja)}
  .marca p{font-size:12px;letter-spacing:.3em;color:var(--suave);margin-top:6px;text-transform:uppercase}
  .data{display:inline-flex;align-items:center;gap:8px;background:rgba(255,122,26,.12);border:1px solid rgba(255,122,26,.4);color:var(--laranja2);padding:8px 14px;border-radius:30px;font-weight:600;font-size:13px}
  .data::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--laranja);box-shadow:0 0 10px var(--laranja);animation:pisca 1.8s ease-in-out infinite}
  @keyframes pisca{50%{opacity:.35}}
  /* destaque com prato flutuando e vapor */
  .destaque{position:relative;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:10px;padding:10px 28px 6px;min-height:280px}
  .destaque .txt small{display:block;font:600 13px Oswald,sans-serif;letter-spacing:.35em;color:var(--laranja);text-transform:uppercase}
  .destaque .txt h2{font:700 clamp(32px,6.5vw,52px)/1.02 Oswald,sans-serif;text-transform:uppercase;margin:8px 0 12px}
  .destaque .txt p{color:var(--suave);font-size:15px;line-height:1.5;max-width:330px}
  .destaque .txt .apartir{margin-top:16px;font:600 15px Inter;color:var(--texto)}
  .destaque .txt .apartir b{font:700 30px Oswald;color:var(--laranja);margin-left:6px}
  .palco{position:relative;height:300px;display:grid;place-items:center;transform-style:preserve-3d}
  .palco .chao{position:absolute;bottom:18px;width:66%;height:34px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.75),transparent);animation:sombra 5s ease-in-out infinite}
  @keyframes sombra{50%{transform:scale(.86);opacity:.7}}
  .flutua{animation:flutua 5s ease-in-out infinite;transform:translateZ(60px)}
  @keyframes flutua{50%{translate:0 -14px;rotate:2deg}}
  .vapor{position:absolute;top:8%;left:50%;width:120px;height:120px;pointer-events:none}
  .vapor span{position:absolute;bottom:0;width:22px;height:90px;border-radius:50%;background:linear-gradient(transparent,rgba(255,255,255,.35),transparent);filter:blur(9px);animation:sobe 3.6s ease-in infinite;opacity:0}
  .vapor span:nth-child(1){left:10px}.vapor span:nth-child(2){left:44px;animation-delay:1.2s}.vapor span:nth-child(3){left:76px;animation-delay:2.4s}
  @keyframes sobe{0%{transform:translateY(30px) scaleX(.6);opacity:0}30%{opacity:.8}100%{transform:translateY(-70px) scaleX(1.4);opacity:0}}
  /* foto do prato (IA com fundo escuro) ou tigela 3D desenhada */
  .foto{border-radius:50%;object-fit:cover;-webkit-mask-image:radial-gradient(circle,#000 58%,transparent 71%);mask-image:radial-gradient(circle,#000 58%,transparent 71%);filter:drop-shadow(0 20px 20px rgba(0,0,0,.6)) saturate(1.1)}
  .tigela{position:relative;display:grid;place-items:center}
  .tigela .bowl{position:absolute;bottom:0;left:6%;right:6%;height:52%;border-radius:0 0 50% 50%/0 0 100% 100%;background:linear-gradient(180deg,#3aa0e6,#1b6fb8 60%,#124e86);box-shadow:inset 0 -10px 18px rgba(0,0,0,.35),inset 0 6px 0 rgba(255,255,255,.25),0 18px 26px -10px rgba(0,0,0,.7)}
  .tigela .borda{position:absolute;bottom:48%;left:4%;right:4%;height:16%;border-radius:50%;background:linear-gradient(180deg,#5fbaf2,#2a86cf);box-shadow:inset 0 3px 6px rgba(0,0,0,.35)}
  .tigela .comida{position:relative;z-index:1;line-height:1;margin-bottom:28%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
  .tigela .comida i{font-style:normal;position:absolute}
  /* cartões dos pratos do sistema (mesmos do "Ver Cardápio") */
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .card{border-radius:20px;overflow:hidden;background:rgba(255,255,255,.04);border:1px solid var(--linha);display:flex;flex-direction:column;transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease;transform-style:preserve-3d}
  .card:hover{transform:translateY(-6px) rotateX(4deg);border-color:rgba(255,122,26,.45);box-shadow:0 26px 40px -22px rgba(0,0,0,.9)}
  .cimg{position:relative;aspect-ratio:4/3;overflow:hidden;background:radial-gradient(circle at 50% 40%,#2a2f37,#14171c)}
  .cimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}.card:hover .cimg img{transform:scale(1.07)}
  .cimg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.55))}
  .semfoto{height:100%;display:grid;place-items:center;color:rgba(255,122,26,.45)}
  .tag{position:absolute;z-index:1;top:12px;left:12px;background:linear-gradient(135deg,var(--laranja2),var(--laranja));color:#1a0d02;font:700 12px Inter;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:20px;box-shadow:0 6px 14px -6px rgba(255,122,26,.8)}
  .cbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
  .cbody h4{font:700 21px Oswald;letter-spacing:.02em;text-transform:uppercase}
  .cbody p{font-size:13.5px;color:var(--suave);line-height:1.45}
  .crow{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .crow b{font:700 26px Oswald;color:var(--laranja)}
  .cbtn{background:linear-gradient(135deg,#2bd96b,#16a34a);color:#04170b;font:700 14px Inter;text-decoration:none;padding:9px 18px;border-radius:24px;box-shadow:0 10px 18px -10px rgba(22,163,74,.9)}
  .heroimg{width:300px;max-width:100%;aspect-ratio:1;object-fit:cover;border-radius:28px;display:block;box-shadow:0 30px 50px -20px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.08);transform:rotate(-3deg)}
  .destaque.so-texto{grid-template-columns:1fr;min-height:0;padding-bottom:10px}
  .item .mini{width:58px;height:58px;border-radius:14px;object-fit:cover;flex-shrink:0;margin:0}
  /* ===== melhorias: barra de atalhos, cartões compactos no celular ===== */
  .atalhos{position:sticky;top:0;z-index:4;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 28px;margin:4px 0 0;
    background:linear-gradient(180deg,rgba(20,23,28,.97),rgba(20,23,28,.88));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--linha)}
  .atalhos::-webkit-scrollbar{display:none}
  .atalhos a{flex-shrink:0;padding:8px 16px;border-radius:30px;border:1px solid var(--linha);color:var(--suave);font:600 13.5px Inter;text-decoration:none;transition:all .2s ease}
  .atalhos a:hover{color:var(--texto);border-color:rgba(255,122,26,.45)}
  .atalhos a.on{background:linear-gradient(135deg,var(--laranja2),var(--laranja));color:#1a0d02;border-color:transparent}
  .quadro{overflow:visible}.quadro>header{border-radius:26px 26px 0 0}
  .bloco{scroll-margin-top:70px}
  .cbody h4{font-size:19px}
  .crow{gap:6px}.crow b{white-space:nowrap;font-size:clamp(19px,1.75vw,23px)}.cbtn{flex-shrink:0;padding:8px 14px;font-size:13px}
  @media (max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.precos{grid-template-columns:repeat(2,1fr)!important}}
  @media (max-width:640px){
    .atalhos{padding:10px 14px}
    .cards{grid-template-columns:1fr;gap:10px}
    .card{flex-direction:row;min-height:128px}
    .card .cimg{aspect-ratio:auto;width:42%;max-width:170px;flex-shrink:0}
    .card .cimg::after{background:linear-gradient(90deg,transparent 60%,rgba(0,0,0,.35))}
    .card .tag{top:8px;left:8px;font-size:10.5px;padding:4px 9px}
    .cbody{padding:12px 12px 12px 14px;gap:5px}.cbody h4{font-size:17px;line-height:1.1}.cbody p{font-size:12.5px}
    .crow b{font-size:22px}.cbtn{padding:8px 14px;font-size:13px}
    .lista{grid-template-columns:1fr!important}
  }
  /* ===== valores, guarnições e fitness clicáveis + endereço ===== */
  .dica{font-size:12.5px;color:var(--suave);margin:-8px 0 12px}
  .pontos.clicaveis li{cursor:pointer;padding:7px 10px;margin:0 -10px;border-radius:10px;align-items:center;transition:background .2s ease}
  .pontos.clicaveis li::before{margin-top:0}
  .pontos.clicaveis li .mais{margin-left:auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 16px Inter;color:var(--laranja2);border:1px solid rgba(255,122,26,.4);transition:all .2s ease}
  .pontos.clicaveis li:hover,.pontos.clicaveis li:focus-visible{background:rgba(255,122,26,.08);outline:none}
  .pontos.clicaveis li:hover .mais{background:var(--laranja);color:#1a0d02}
  .fitbox{cursor:pointer;border-radius:18px;padding:12px 14px;margin:-12px -14px;transition:background .25s ease}
  .fitbox:hover,.fitbox:focus-visible{background:rgba(34,197,94,.06);outline:none}
  .fitpreco{align-items:center}.fitpreco .vai,.preco .vai{font:700 12.5px Inter;color:var(--laranja2)}
  .precos{grid-template-columns:repeat(4,1fr)}
  button.preco{font-family:inherit;color:var(--texto);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
  .preco .pinfo{font-size:12px;color:var(--suave);line-height:1.35;margin-top:6px;min-height:32px;max-width:190px}
  .preco .vai{margin-top:8px;padding:6px 14px;border-radius:20px;border:1px solid rgba(255,122,26,.45);transition:all .2s ease}
  button.preco:hover{border-color:rgba(255,122,26,.55)}button.preco:hover .vai{background:var(--laranja);color:#1a0d02}
  button.preco:focus-visible,button.especial:focus-visible{outline:2px solid var(--laranja);outline-offset:3px}
  .preco.fit .tam{background:linear-gradient(135deg,#4ade80,#16a34a);color:#04170b;font-size:16px;box-shadow:0 8px 18px -6px rgba(22,163,74,.8)}
  button.especial{width:100%;font-family:inherit;color:var(--texto);cursor:pointer;text-align:left;transition:background .2s ease,border-color .2s ease}
  button.especial:hover{background:rgba(255,122,26,.12);border-style:solid}
  .especial .en small{display:block;margin-top:4px;font:500 12px Inter;letter-spacing:0;text-transform:none;color:var(--suave)}
  .local{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding:20px 22px;border-radius:22px;
    background:radial-gradient(circle at 0% 50%,rgba(255,122,26,.16),transparent 55%),rgba(255,255,255,.04);border:1px solid rgba(255,122,26,.3)}
  .local-pin{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#1a0d02;background:linear-gradient(135deg,var(--laranja2),var(--laranja));box-shadow:0 0 0 8px rgba(255,122,26,.15),0 12px 24px -10px rgba(255,122,26,.9);animation:pino 2.4s ease-in-out infinite}
  .local-pin svg{width:28px;height:28px}
  @keyframes pino{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .local-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
  .local-txt b{font:700 22px Oswald;letter-spacing:.02em}.local-txt span{color:var(--suave);font-size:14.5px}.local-txt .local-tel{color:var(--texto);font-size:13.5px;margin-top:4px}
  .local-acoes{display:flex;flex-direction:column;gap:8px}
  .local-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 22px;border-radius:40px;text-decoration:none;white-space:nowrap;
    background:linear-gradient(135deg,var(--laranja2),var(--laranja));color:#1a0d02;font:700 15px Inter;box-shadow:0 14px 26px -12px rgba(255,122,26,.9);transition:transform .2s ease}
  .local-btn:hover{transform:translateY(-2px)}.local-btn svg{width:18px;height:18px}
  .local-btn2{text-align:center;padding:9px 16px;border-radius:40px;border:1px solid var(--linha);color:var(--texto);text-decoration:none;font:600 13px Inter}
  .local-btn2:hover{border-color:rgba(255,122,26,.5);color:var(--laranja2)}
  @media (max-width:640px){
    .precos{grid-template-columns:1fr 1fr}.preco .pinfo{min-height:0}
    .fitbox{margin:0;padding:0}
    .local{grid-template-columns:auto 1fr;padding:18px}.local-acoes{grid-column:1/-1}.local-txt b{font-size:19px}
    .especial{flex-direction:column;align-items:flex-start}
  }
  /* ===== monte seu pedido ===== */
  .cbtn{border:none;cursor:pointer}
  .item[data-pedir]{cursor:pointer}.item[data-pedir]::after{content:'Pedir →';flex-shrink:0;font:700 12px Inter;color:var(--laranja2);opacity:0;transition:opacity .2s ease}.item[data-pedir]:hover::after,.item[data-pedir]:focus-visible::after{opacity:1}
  body.sem-rolagem{overflow:hidden}
  .ped-fundo{position:fixed;inset:0;z-index:20;background:rgba(5,6,8,.74);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px}
  .ped-fundo[hidden]{display:none}
  .ped{position:relative;width:100%;max-width:580px;max-height:min(92vh,880px);display:flex;flex-direction:column;border-radius:26px;overflow:hidden;
    background:radial-gradient(ellipse 90% 28% at 50% 0%,rgba(255,122,26,.14),transparent 70%),linear-gradient(170deg,#1f242b,#131619 60%);border:1px solid rgba(255,255,255,.08);box-shadow:0 40px 90px -30px rgba(0,0,0,.95)}
  .ped-alca{display:none}
  .ped-topo{display:flex;align-items:center;gap:14px;padding:18px 18px 14px 20px;border-bottom:1px solid var(--linha);touch-action:none}
  .ped-hero{width:64px;height:64px;border-radius:50%;overflow:hidden;flex-shrink:0;box-shadow:0 0 0 3px rgba(255,122,26,.55),0 10px 22px -8px rgba(0,0,0,.8)}
  .ped-hero img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.25)}
  .ped-hero[hidden]{display:none}
  .ped-tt{flex:1;min-width:0}
  .ped-tt small{font:700 10.5px Inter;letter-spacing:.3em;color:var(--laranja);text-transform:uppercase}
  .ped-tt h3{font:700 25px/1.05 Oswald;text-transform:uppercase;letter-spacing:.02em;margin:2px 0 7px}
  .ped-passos{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .ped-passos span{font:600 11.5px Inter;color:var(--suave);padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.06);transition:all .25s ease}
  .ped-passos span.ok{color:#4ade80;background:rgba(34,197,94,.14)}
  .ped-passos i{width:10px;height:1px;background:var(--linha)}
  .ped-x{align-self:flex-start;width:40px;height:40px;border-radius:50%;border:1px solid var(--linha);background:rgba(255,255,255,.05);color:var(--texto);font-size:24px;line-height:1;cursor:pointer;flex-shrink:0;transition:all .2s ease}
  .ped-x:hover{border-color:var(--laranja);color:var(--laranja2);transform:rotate(90deg)}
  .ped-corpo{overflow:auto;padding:4px 20px 18px;overscroll-behavior:contain;scroll-behavior:smooth}
  .ped-sec{padding:16px 0 18px;border-bottom:1px solid var(--linha);border-radius:14px}
  .ped-sec:last-child{border-bottom:none}
  .ped-sec.alerta{animation:alerta 1.3s ease}
  @keyframes alerta{0%,100%{background:transparent;box-shadow:none}20%,60%{background:rgba(255,122,26,.10);box-shadow:0 0 0 8px rgba(255,122,26,.10)}}
  .ped-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .ped-n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:rgba(255,122,26,.16);color:var(--laranja2);font:700 13px Inter;transition:all .25s ease}
  .ped-n.ok{background:#22c55e;color:#06210f}.ped-n svg{width:15px;height:15px}
  .ped-h h4{font:700 17px Oswald;letter-spacing:.08em;text-transform:uppercase}
  .ped-req,.ped-opc{margin-left:auto;font:600 11px Inter;color:var(--suave);background:rgba(255,255,255,.06);padding:3px 9px;border-radius:20px}
  .ped-cont{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font:700 12px Inter;color:var(--texto);background:rgba(255,255,255,.07);padding:4px 10px;border-radius:20px}
  .ped-cont i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);transition:background .2s ease}.ped-cont i.on{background:var(--laranja)}
  .ped-cont.cheio{background:rgba(34,197,94,.16);color:#4ade80}.ped-cont.cheio i.on{background:#22c55e}
  .ped-nota{font-size:12.5px;color:var(--suave);margin:-4px 0 12px;line-height:1.45}
  /* tamanhos: cartões com a foto do prato */
  .ped-tams{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
  .ped-tam{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 8px 11px;border-radius:18px;border:1.5px solid var(--linha);background:rgba(255,255,255,.035);color:var(--texto);cursor:pointer;font-family:inherit;transition:all .2s ease}
  .ped-tam img,.ped-tam-l{width:54px;height:54px;border-radius:50%;object-fit:cover;margin-bottom:4px;box-shadow:0 8px 16px -8px rgba(0,0,0,.8)}
  .ped-tam-l{display:grid;place-items:center;background:rgba(255,122,26,.14);color:var(--laranja2);font:700 19px Oswald}
  .ped-tam-n{font:600 13px Inter}.ped-tam em{font:700 16px Oswald;font-style:normal;color:var(--laranja2)}
  .ped-tam-ok{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--laranja);color:#1a0d02;display:grid;place-items:center;opacity:0;transform:scale(.4);transition:all .25s cubic-bezier(.3,1.6,.5,1)}
  .ped-tam-ok svg{width:12px;height:12px}
  .ped-tam:hover{border-color:rgba(255,122,26,.5);transform:translateY(-2px)}

      return `<button type="button" class="preco${k === 'F' ? ' fit' : ''}" data-pedir="${k}" aria-label="Pedir ${n} por R$ ${esc(v)}"><div class="tam">${k === 'F' ? 'FIT' : k}</div><div class="tamtxt">${n}</div><div class="v"><small>R$</small>${esc(v)}</div><div class="pinfo">${esc(info)}</div><span class="vai">Pedir →</span></button>`; }).join('')}</div>
    ${valor(es.nome) && ['P','M','G'].some(k => valor(es[k])) ? `<button type="button" class="especial" data-pedir="M" data-especial="1"><div class="en">${esc(es.nome)}<small>Pratos especiais · toque para pedir</small></div><div class="ev">${['P','M','G'].filter(k => valor(es[k])).map(k => `<span><i>${k}</i>R$ ${esc(es[k])}</span>`).join('')}</div></button>` : ''}</section>` : ''}
  ${emp.endereco ? `<section class="bloco entra" id="sec-local"><div class="titulo"><h3>Onde <em>estamos</em></h3></div>

      <div class="local-txt"><b>${esc(emp.endereco.split(' - ')[0])}</b><span>${esc(emp.endereco.split(' - ').slice(1).join(' - '))}</span>${emp.whatsapp ? `<span class="local-tel">📲 WhatsApp ${esc(emp.whatsapp)}</span>` : ''}</div>
      <div class="local-acoes">
        <a class="local-btn" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent((emp.nome || '') + ', ' + emp.endereco)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"/></svg>Como chegar</a>
        <a class="local-btn2" href="https://waze.com/ul?q=${encodeURIComponent(emp.endereco)}&navigate=yes" target="_blank" rel="noopener">Abrir no Waze</a>
      </div>
    </div></section>` : ''}
  <footer class="entra"><div>Pratto di Casa · Comida caseira · Cajamar</div>
    <div style="text-align:right">${d.atualizado ? 'Atualizado em ' + esc(new Date(d.atualizado).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' })) : ''}<br><span style="font-size:11.5px">Imagens ilustrativas</span></div></footer>`;
}
// Animações com Motion (mola, entrada em sequência, aparecer ao rolar, parallax). Sem Motion, usa as animações em CSS.
function animarMotion() {
  const { animate, inView, scroll, stagger, hover, press } = window.Motion;
  const mola = (bounce, duration) => ({ type: 'spring', bounce, duration });
  const limpar = (els) => els.forEach(e => { e.style.transform = ''; }); // devolve o "hover" em CSS depois da entrada
  document.querySelectorAll('.entra').forEach(e => { e.style.transition = 'none'; e.classList.add('on'); if (e.tagName !== 'HEADER') e.style.opacity = '0'; });
  const fim = []; const concluir = (lista, ms) => setTimeout(() => lista.forEach(a => { try { a && a.complete(); } catch (e) {} }), ms || 1600);
  const topo = document.querySelector('header.entra'); if (topo) fim.push(animate(topo, { y: [-24, 0] }, mola(.3, .8)));
  const dest = document.querySelector('.destaque');
  if (dest) {
    dest.style.opacity = '1';
    fim.push(animate(dest.querySelectorAll('.txt > *'), { opacity: [0, 1], x: [-34, 0] }, { ...mola(.25, .8), delay: stagger(.08, { startDelay: .15 }) }));
    const img = dest.querySelector('.heroimg');
    if (img) {
      fim.push(animate(img, { opacity: [0, 1], scale: [.55, 1], rotate: [-20, -3] }, { ...mola(.45, 1.1), delay: .2 }));
      scroll(animate(dest.querySelector('.flutua'), { y: [0, -70], rotate: [0, 7] }, { ease: 'linear' }), { target: dest, offset: ['start start', 'end start'] });
    }
  }
  concluir(fim);
  // cada seção aparece quando entra na tela, com os itens em sequência
  inView('.bloco.entra, footer.entra', (el) => {
    concluir([animate(el, { opacity: [0, 1], y: [40, 0] }, mola(.2, .8))], 1400);
    const filhos = [...el.querySelectorAll('.card, .item, .pontos li, .preco, .especial, .fitpreco')];
    if (filhos.length) { const a2 = animate(filhos, { opacity: [0, 1], y: [34, 0], scale: [.94, 1] }, { ...mola(.32, .75), delay: stagger(.06, { startDelay: .08 }) }); a2.then(() => limpar(filhos)); concluir([a2], 2200); }
  }, { amount: .12 });
  // foto do cartão cresce com mola ao passar o mouse; botões "afundam" ao tocar
  hover('.card', (el) => { const im = el.querySelector('.cimg img'); if (!im) return; animate(im, { scale: 1.09 }, mola(.4, .5)); return () => animate(im, { scale: 1 }, mola(.3, .5)); });
  press('.cbtn', (el) => { animate(el, { scale: .9 }, mola(.5, .25)); return () => animate(el, { scale: 1 }, mola(.6, .45)); });
  const pedir = document.getElementById('pedir');
  if (pedir) {
    animate(pedir, { x: ['-50%', '-50%'], y: [140, 0], opacity: [0, 1] }, { ...mola(.5, 1), delay: .9 });
    press(pedir, () => { animate(pedir, { scale: .92 }, mola(.5, .25)); return () => animate(pedir, { scale: 1 }, mola(.6, .45)); });
  }
}
function ligarAtalhos() {
  const nav = document.querySelector('.atalhos'); if (!nav) return;
  nav.addEventListener('click', (e) => { const a = e.target.closest('[data-ir]'); if (!a) return; e.preventDefault();
    const s = document.getElementById(a.dataset.ir); if (s) window.scrollTo({ top: s.getBoundingClientRect().top + scrollY - nav.offsetHeight - 14, behavior: semMovimento() ? 'auto' : 'smooth' }); });
  const links = [...nav.querySelectorAll('a')];
  const obs = new IntersectionObserver((ents) => ents.forEach(en => { if (!en.isIntersecting) return;
    links.forEach(l => l.classList.toggle('on', l.dataset.ir === en.target.id));
    const on = nav.querySelector('.on'); if (on) nav.scrollTo({ left: on.offsetLeft - 16, behavior: 'smooth' }); }), { rootMargin: '-35% 0px -60% 0px' });
  links.forEach(l => { const s = document.getElementById(l.dataset.ir); if (s) obs.observe(s); });
}
function animar() {
  const reduzir = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (window.Motion && !reduzir) { try { animarMotion(); } catch (e) { console.warn('[motion]', e); document.querySelectorAll('.entra').forEach(el => { el.style.opacity = ''; el.classList.add('on'); }); } }
  else { const els = [...document.querySelectorAll('.entra')]; els.forEach((el, i) => setTimeout(() => el.classList.add('on'), 80 + i * 110)); }
  // quadro inclina em 3D com o mouse (computador) ou com o celular
  const q = document.getElementById('quadro'); if (reduzir) return;
  const incl = (x, y) => { q.style.transform = `rotateY(${x * 5}deg) rotateX(${-y * 4}deg)`; };
  addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') incl(e.clientX / innerWidth - .5, e.clientY / innerHeight - .5); });
}
(function bokeh() { const b = document.querySelector('.bokeh'); for (let i = 0; i < 14; i++) { const s = 40 + Math.random() * 140; const el = document.createElement('i');
  el.style.cssText = `width:${s}px;height:${s}px;left:${Math.random() * 100}%;top:${Math.random() * 100}%;opacity:${.15 + Math.random() * .35};animation-delay:-${Math.random() * 14}s`; b.appendChild(el); } })();
async function iniciar() {
  const q = document.getElementById('quadro'); let d = null;
  const p = new URLSearchParams(location.search);
  if (!p.has('demo')) { try { const r = await fetch(DADOS_URL + '?v=' + Date.now(), { cache:'no-store' }); if (r.ok) d = await r.json(); } catch (e) {} }
  if (!d && p.has('demo')) d = PADRAO;
  if (!d) { // sem cardápio publicado (ou sem internet): não mostra cardápio antigo, só o caminho para pedir
    document.body.classList.remove('na-capa'); montar(PADRAO); q.innerHTML = '<div class="aviso"><div style="font:700 30px Oswald;color:#f3f4f6;margin-bottom:10px">PRATTO DI <span style="color:#ff7a1a">CASA</span></div>O cardápio de hoje ainda não foi publicado.<br>Chame a gente no WhatsApp que passamos os pratos do dia! 😊</div>'; return; }
  DADOS = d; q.innerHTML = montar(d);
  document.getElementById('capa').innerHTML = capaHTML(d);
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  if (new URLSearchParams(location.search).has('cardapio')) history.replaceState(null, '', location.pathname + location.search + '#cardapio');
  else if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  window.scrollTo(0, 0); rota(); addEventListener('hashchange', rota);
}
