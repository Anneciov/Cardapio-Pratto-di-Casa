document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

s=\"pdc-auth-head\">Pedidos do <b>WhatsApp<\u002Fb> direto na cozinha<\u002Fdiv><div class=\"pdc-auth-desc\">Receba, aceite e acompanhe cada pedido até a entrega, com o cliente avisado em cada etapa.<\u002Fdiv><\u002Fdiv>\n          <div class=\"{{ loginSlide1 }}\"><div class=\"pdc-auth-head\"><b>Crediário<\u002Fb> e cobrança sem caderninho<\u002Fdiv><div class=\"pdc-auth-desc\">Saldo de cada cliente e empresa, extrato impresso e cobrança pelo WhatsApp em um clique.<\u002Fdiv><\u002Fdiv>\n          <div class=\"{{ loginSlide2 }}\"><div class=\"pdc-auth-head\"><b>Cardápio<\u002Fb>, estoque e entregas<\u002Fdiv><div class=\"pdc-auth-desc\">Cardápio do dia, controle de estoque, motoboys e comprovante com QR na impressora térmica.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"pdc-auth-dots\"><span class=\"{{ loginDot0 }}\" onclick=\"{{ loginIr0 }}\"><\u002Fspan><span class=\"{{ loginDot1 }}\" onclick=\"{{ loginIr1 }}\"><\u002Fspan><span class=\"{{ loginDot2 }}\" onclick=\"{{ loginIr2 }}\"><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"pdc-auth-right\">\n        <div class=\"pdc-auth-ola\">Olá!<\u002Fdiv>\n        <sc-if value=\"{{ isLoginMode }}\" hint-placeholder-val=\"{{ true }}\">\n          <div class=\"pdc-auth-sub\">Acesse sua conta para continuar<\u002Fdiv>\n          <div class=\"pdc-auth-tabs\"><button type=\"button\" class=\"pdc-auth-tab on\">Entrar<\u002Fbutton><button type=\"button\" class=\"pdc-auth-tab\" onclick=\"{{ goToSignup }}\">Cadastrar<\u002Fbutton><\u002Fdiv>\n          <form onsubmit=\"{{ doLogin }}\">\n            <label class=\"pdc-auth-campo\"><span>E-mail<\u002Fspan><input name=\"email\" type=\"email\" required=\"\" autocomplete=\"email\" placeholder=\"voce@email.com\"><\u002Flabel>\n            <label class=\"pdc-auth-campo\"><span>Senha<\u002Fspan><input name=\"password\" type=\"password\" required=\"\" autocomplete=\"current-password\" placeholder=\"••••••••\"><\u002Flabel>\n            <sc-if value=\"{{ loginError }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"pdc-auth-msg err\">{{ loginError }}<\u002Fdiv><\u002Fsc-if>\n            <button type=\"submit\" class=\"pdc-auth-btn\">{{ loginBtnLabel }}<\u002Fbutton>\n          <\u002Fform>\n          <button type=\"button\" class=\"pdc-auth-demo\" onclick=\"{{ enterDemo }}\">Entrar em modo demonstração<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isSignupMode }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"pdc-auth-sub\">Crie a conta da equipe<\u002Fdiv>\n          <div class=\"pdc-auth-tabs\"><button type=\"button\" class=\"pdc-auth-tab\" onclick=\"{{ goToLogin }}\">Entrar<\u002Fbutton><button type=\"button\" class=\"pdc-auth-tab on\">Cadastrar<\u002Fbutton><\u002Fdiv>\n          <div class=\"pdc-auth-info\">{{ signupSlotsMsg }}<\u002Fdiv>\n          <form onsubmit=\"{{ doSignup }}\">\n            <label class=\"pdc-auth-campo\"><span>Nome<\u002Fspan><input name=\"name\" required=\"\" autocomplete=\"name\" placeholder=\"Seu nome\"><\u002Flabel>\n            <label class=\"pdc-auth-campo\"><span>E-mail<\u002Fspan><input name=\"email\" type=\"email\" required=\"\" autocomplete=\"email\" placeholder=\"voce@email.com\"><\u002Flabel>\n            <label class=\"pdc-auth-campo\"><span>Senha<\u002Fspan><input name=\"password\" type=\"password\" required=\"\" minlength=\"6\" autocomplete=\"new-password\" placeholder=\"mínimo 6 caracteres\"><\u002Flabel>\n            <sc-if value=\"{{ signupError }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"pdc-auth-msg err\">{{ signupError }}<\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ signupSuccess }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"pdc-auth-msg ok\">{{ signupSuccess }}<\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{ hasSlots }}\" hint-placeholder-val=\"{{ true }}\"><button type=\"submit\" class=\"pdc-auth-btn\">{{ signupBtnLabel }}<\u002Fbutton><\u002Fsc-if>\n            <sc-if value=\"{{ noSlots } .unidade||'un', supplier: p.fornecedor||'—' })),\n      stockHistory: (mov||[]).map(h => ({ id: h.id, date: this.fmtDateBR(h.data), product: h.rest_produtos ? h.rest_produtos.nome : '—', type: h.tipo === 'entrada' ? 'entrada' : 'baixa', qty: Number(h.quantidade)||0 })),\n    });\n  };\n\n  loadEntregas = async () => {\n    const { data, error } = await sb.from('rest_entregas').select('id,motoboy_id,regiao,taxa,status,data_entrega,pedido_ref,rest_motoboys(nome)').order('created_at', { ascending: false }).limit(80);\n    if (error) { console.error(error); return; }\n    this.setState({ deliveries: (data||[]).map(d => ({ id: d.id, date: this.fmtDateBR(d.data_entrega), motoboy: d.rest_motoboys ? d.rest_motoboys.nome : '—', region: d.regiao||'—', fee: Number(d.taxa)||0, orderRef: d.pedido_ref||'—', status: d.status })) });\n  };\n\n  loadCrediarioHistory = async () => {\n    const { data, error } = await sb.from('rest_crediario_lancamentos').select('id,tipo,valor,data,rest_clientes(nome),rest_empresas(nome)').order('created_at', { ascending: false }).limit(120);\n    if (error) { console.error(error); return; }\n    const typeLabels = { pagamento: 'Pagamento', fatura_fechada: 'Fatura fechada', cobranca_enviada: 'Cobrança enviada', debito: 'Débito' };\n    this.setState({ crediarioHistory: (data||[]).map(h => ({ id: h.id, date: this.fmtDateBR(h.data), client: (h.rest_clientes && h.rest_clientes.nome) || (h.rest_empresas && h.rest_empresas.nome) || '—', type: typeLabels[h.tipo] || h.tipo, amount: Number(h.valor)||0 })) });\n  };\n\n  loadMotoboyPayments = async () => {\n    const { data, error } = await sb.from('rest_motoboy_pagamentos').select('id,detalhe,valor,data,rest_motoboys(nome)').order('created_at', { ascending: false }).limit(60);\n    if (error) { console.error(error); return; }\n    this.setState({ motoboyPayments: (data||[]).map(p => ({ id: p.id, date: this.fmtDateBR(p.data), motoboy: p.rest_motoboys ? p.rest_motoboys.nome : '—', detail: p.detalhe||'', amount: dal:null,selectedCompany:null});\n    this.showToast('Funcionário registrado em '+compName+'.'); this.loadClientesEmpresas(); };\n\n  deleteClient=async(id)=>{ const { error } = await sb.from('rest_clientes').update({ ativo:false }).eq('id',id);\n    if(error){ this.showToast('Erro: '+error.message); return; }\n    this.showToast('Cliente removido.'); this.loadClientesEmpresas(); };\n\n  /* ================= PACOTES ================= */\n  submitPacote=async(e)=>{ e.preventDefault(); const f=e.target.elements;\n    const cid=f.client.value; const price=parseFloat(f.price.value)||0; const meals=parseInt(f.meals.value)||1; const pay=f.payment.value;\n    const { data: pac, error } = await sb.from('rest_pacotes').insert({ cliente_id:cid, nome:f.name.value, refeicoes:meals, preco:price, forma_pagamento:pay }).select('id').single();\n    if(error){ this.showToast('Erro: '+error.message); return; }\n    await sb.from('rest_pedidos').insert({ cliente_id:cid, origem:'manual', status:'entregue', total:price, forma_pagamento:pay });\n    if(pay==='crediario'){ await this.addClientBalance(cid, price); await this.logCrediario(cid, null, 'debito', price, 'Pacote: '+f.name.value); }\n    this.setState({modal:null}); this.showToast(pay==='crediario'?'Pacote registrado no crediário.':'Pacote registrado.');\n    this.loadPacotes(); this.loadPedidos(); this.loadClientesEmpresas(); };\n\n  consumePacote=async(id)=>{ const p=this.state.pacotes.find(x=>x.id===id);\n    if(!p||p.used>=p.meals){ this.showToast('Pacote já foi todo consumido.'); return; }\n    const { error } = await sb.from('rest_pacotes').update({ usadas:p.used+1 }).eq('id',id);\n    if(error){ this.showToast('Erro: '+error.message); return; }\n    this.showToast('Refeição consumida ('+(p.used+1)+'/'+p.meals+') — '+this.clientName(p.clientId)+'.'); this.loadPacotes(); };\n\n  deletePacote=async(id)=>{ const { error } = await sb.from('rest_pacotes').delete().eq('id',id);\n    if(error){ this.showToast('Erro: '+error.messag lico (no modo demonstração, fica só na tela)\n  /* ============ NOTA FISCAL (NFC-e): só no computador do balcão, pelo programa local (whatsapp-local/nfce.js) ============ */\n  _nfSessao='';\n  _nfEsc=(s)=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');\n  _nf=async(metodo,rota,corpo)=>{\n    if(!this.state.waLocalToken) await this.waProcurarLocal();\n    const tk=this.state.waLocalToken;\n    if(!tk) throw new Error('O programa do Pratto di Casa (WhatsApp e Nota Fiscal) não está aberto neste computador. Abra o sistema pelo atalho da área de trabalho.');\n    let r;\n    try{ r=await fetch(WA_LOCAL_URL+rota,{ method:metodo, headers:{ 'Content-Type':'application/json', 'x-token':tk, 'x-nfce':this._nfSessao||'' }, body:corpo?JSON.stringify(corpo):undefined }); }\n    catch(e){ throw new Error('Não encontrei o programa local da Nota Fiscal neste computador.'); }\n    let j={}; try{ j=await r.json(); }catch(e){}\n    if(r.status===401) this._nfSessao='';\n    if(!r.ok||j.error){ const er=new Error(j.error||('erro '+r.status)); er.status=r.status; throw er; }\n    return j; };\n  abrirNotaFiscal=async()=>{\n    if(this._nfOv) return;\n    const ov=document.createElement('div'); this._nfOv=ov;\n    ov.style.cssText='position:fixed;inset:0;z-index:99990;background:rgba(1,12,24,.86);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 16px;font-family:inherit';\n    ov.innerHTML='<div id=\"nf-caixa\" style=\"width:min(1000px,100%);background:#0f1a24;border:1px solid #23384a;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.6);color:#e6eef3;overflow:hidden\"><\u002Fdiv>';\n    document.body.appendChild(ov);\n    this._nfTecla=(e)=>{ if(e.key==='Escape') this.fecharNotaFiscal(); }; document.addEventListener('keydown',this._nfTecla);\n    const cx=ov.querySelector('#nf-caixa');\n    cx.addEventListener('click',(e)=>{ const b=e.target.closest('[data-
